name: SCM integration gates

on:
  pull_request:
    paths:
      - "scm/**"
      - ".github/workflows/scm-integration-gates.yml"
  push:
    branches:
      - "codex/scm-integration-**"
      - "codex/scm-post-stack-**"
    paths:
      - "scm/**"
      - ".github/workflows/scm-integration-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scm-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-scope:
    name: SCM bootstrap scope
    if: github.event_name == 'pull_request' && github.event.number == 23
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify workflow-only bootstrap diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          test "$changed_files" = ".github/workflows/scm-integration-gates.yml"

  scm-gates:
    name: SCM gates
    # PR 23 is the immutable workflow-only bootstrap; every other PR/branch runs the full job.
    if: github.event_name != 'pull_request' || github.event.number != 23
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: scm/drafts/prototypes/scm-data-governance-workbench-v0
    env:
      DEEPSEEK_API_KEY: ""
      SCM_DEEPSEEK_PROVIDER_CALL_AUTHORIZED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scm/drafts/prototypes/scm-data-governance-workbench-v0/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Verify provider authorization gate
        run: npm run smoke:provider-gate

      - name: Verify monorepo and standalone path contract
        run: npm run smoke:path-contract

      - name: Run preproduction gate
        env:
          SCM_PREPROD_SCAN_ROOT: ${{ github.workspace }}/scm
        run: npm run preprod:check

      - name: Verify readonly smoke and SQLite hash
        shell: bash
        run: |
          set -euo pipefail
          db_path="data/governance_workbench.sqlite"
          before_hash="$(sha256sum "$db_path" | awk '{print $1}')"
          HOST=127.0.0.1 PORT=5194 npm run start >/tmp/scm-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5194/api/deploy/health >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/scm-server.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5194/api/deploy/health >/dev/null
          SCM_WORKBENCH_READONLY_BASE_URL=http://127.0.0.1:5194 npm run smoke:readonly
          after_hash="$(sha256sum "$db_path" | awk '{print $1}')"
          test "$before_hash" = "$after_hash"
          cleanup
          trap - EXIT

      - name: Verify clean diff
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"

  integration-gate:
    name: SCM integration gate
    if: always()
    needs:
      - bootstrap-scope
      - scm-gates
    runs-on: ubuntu-latest
    steps:
      - name: Enforce the event-specific gate result
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.number }}
          BOOTSTRAP_RESULT: ${{ needs.bootstrap-scope.result }}
          SCM_GATES_RESULT: ${{ needs.scm-gates.result }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" && "$PR_NUMBER" == "23" ]]; then
            test "$BOOTSTRAP_RESULT" = "success"
            test "$SCM_GATES_RESULT" = "skipped"
          else
            test "$BOOTSTRAP_RESULT" = "skipped"
            test "$SCM_GATES_RESULT" = "success"
          fi
