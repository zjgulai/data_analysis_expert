name: SCM integration gates

on:
  pull_request:
    paths:
      - "scm/**"
      - ".github/workflows/scm-integration-gates.yml"
  push:
    branches:
      - "codex/scm-integration-**"
      - "codex/scm-post-stack-**"
    paths:
      - "scm/**"
      - ".github/workflows/scm-integration-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scm-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-gate:
    name: SCM integration gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: scm/drafts/prototypes/scm-data-governance-workbench-v0
    env:
      DEEPSEEK_API_KEY: ""
      SCM_DEEPSEEK_PROVIDER_CALL_AUTHORIZED: "0"
      SCM_DATABASE_WRITES_AUTHORIZED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scm/drafts/prototypes/scm-data-governance-workbench-v0/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify provider authorization gate
        run: npm run smoke:provider-gate

      - name: Verify database authorization gate
        run: npm run smoke:database-gate

      - name: Verify import authorization gate
        run: npm run smoke:import-gate

      - name: Verify migration rollback guard
        run: npm run smoke:migration-gate

      - name: Verify monorepo and standalone path contract
        run: npm run smoke:path-contract

      - name: Verify manual-gate receipt contracts
        run: npm run smoke:manual-gate-receipts

      - name: Run preproduction gate
        env:
          SCM_PREPROD_SCAN_ROOT: ${{ github.workspace }}/scm
        run: npm run preprod:check

      - name: Verify readonly smoke and SQLite hash
        shell: bash
        run: |
          set -euo pipefail
          db_path="data/governance_workbench.sqlite"
          before_hash="$(sha256sum "$db_path" | awk '{print $1}')"
          HOST=127.0.0.1 PORT=5194 npm run start >/tmp/scm-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5194/api/deploy/health >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/scm-server.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5194/api/deploy/health >/dev/null
          SCM_WORKBENCH_READONLY_BASE_URL=http://127.0.0.1:5194 npm run smoke:readonly
          after_hash="$(sha256sum "$db_path" | awk '{print $1}')"
          test "$before_hash" = "$after_hash"
          cleanup
          trap - EXIT

      - name: Verify API and UI smoke on a restored SQLite fixture
        shell: bash
        run: |
          set -euo pipefail
          db_path="data/governance_workbench.sqlite"
          backup_path="$(mktemp)"
          before_hash="$(sha256sum "$db_path" | awk '{print $1}')"
          cp "$db_path" "$backup_path"
          HOST=127.0.0.1 PORT=5196 SCM_DATABASE_WRITES_AUTHORIZED=1 npm run start >/tmp/scm-write-smoke-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            rm -f "${db_path}-wal" "${db_path}-shm"
            cp "$backup_path" "$db_path"
            rm -f "$backup_path"
          }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5196/api/deploy/health >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/scm-write-smoke-server.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5196/api/deploy/health >/dev/null
          SCM_WORKBENCH_BASE_URL=http://127.0.0.1:5196 npm run smoke:api
          SCM_WORKBENCH_BASE_URL=http://127.0.0.1:5196 SCM_UI_SMOKE_OUTPUT_DIR="${RUNNER_TEMP}/scm-ui-smoke" npm run smoke:ui
          cleanup
          trap - EXIT
          after_hash="$(sha256sum "$db_path" | awk '{print $1}')"
          test "$before_hash" = "$after_hash"

      - name: Verify clean diff
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
